[project]
name = "agents-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]",
    "pydantic-settings>=2.14.0",
]

[dependency-groups]
dev = [
  "mypy>=1.14",
  "ruff>=0.9",
  "pytest>=8.0",
  "pytest-asyncio>=0.25",
  "httpx>=0.28",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]

[tool.fastapi]
entrypoint = "app.app:app"

[tool.uv.workspace]
members = ["agents-template"]
