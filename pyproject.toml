[project]
name = "agents-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["fastapi[standard]"]

[dependency-groups]
dev = ["mypy>=1.14", "ruff>=0.9"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.fastapi]
entrypoint = "app.main:app"

[tool.uv.workspace]
members = ["agents-template"]
