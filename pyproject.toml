[project]
name = "agents-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "deepagents>=0.5.6",
  "langchain-deepseek>=0.1.0",
  "fastapi[standard]",
  "pydantic-settings>=2.14.0",
  "langgraph-checkpoint-postgres>=3.0.5",
  "psycopg[binary]>=3.3.4",
]

[dependency-groups]
dev = [
  "mypy>=1.14",
  "ruff>=0.9",
  "pytest>=8.0",
  "pytest-asyncio>=0.25",
  "httpx>=0.28",
  "pytest-cov>=7.1.0",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib --cov=app --cov-report=term-missing --cov-fail-under=75"

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]
explicit_package_bases = true

[tool.fastapi]
entrypoint = "app.app:app"

[tool.uv.workspace]
members = ["agents-template"]
